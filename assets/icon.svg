<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="head" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#FF8B7E"/>
      <stop offset="0.6" stop-color="#F2544B"/>
      <stop offset="1" stop-color="#D63A35"/>
    </radialGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5463F"/>
      <stop offset="1" stop-color="#B92E2A"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E97A8"/>
      <stop offset="0.5" stop-color="#D9DEE7"/>
      <stop offset="1" stop-color="#8E97A8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8A4B00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Fondo: retícula de iconos de macOS (824 px, margen 100) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Nota de papel, ligeramente girada -->
  <g transform="rotate(-6 512 640)" filter="url(#soft)">
    <rect x="262" y="470" width="500" height="340" rx="40" fill="#FFFFFF"/>
    <g fill="#C9D4EA">
      <rect x="322" y="560" width="300" height="26" rx="13"/>
      <rect x="322" y="624" width="380" height="26" rx="13"/>
      <rect x="322" y="688" width="250" height="26" rx="13"/>
    </g>
  </g>

  <!-- Sombra de la aguja sobre la nota -->
  <ellipse cx="512" cy="522" rx="40" ry="11" fill="#7A4A00" opacity="0.2"/>

  <!-- Aguja (corta: está clavada en la nota) -->
  <rect x="501" y="440" width="22" height="82" rx="11" fill="url(#needle)"/>

  <!-- Pinny: la chincheta -->
  <g filter="url(#soft)">
    <!-- Cuello -->
    <path d="M436 396 L588 396 L566 452 L458 452 Z" fill="url(#collar)"/>
    <ellipse cx="512" cy="452" rx="54" ry="10" fill="#A82A26"/>
    <!-- Cabeza -->
    <ellipse cx="512" cy="282" rx="200" ry="138" fill="url(#head)"/>
  </g>

  <!-- Brillo -->
  <ellipse cx="428" cy="200" rx="64" ry="25" fill="#FFFFFF" opacity="0.45" transform="rotate(-16 428 200)"/>

  <!-- Cara -->
  <g>
    <ellipse cx="444" cy="278" rx="25" ry="33" fill="#2B1B1B"/>
    <ellipse cx="580" cy="278" rx="25" ry="33" fill="#2B1B1B"/>
    <circle cx="453" cy="266" r="9.5" fill="#FFFFFF"/>
    <circle cx="589" cy="266" r="9.5" fill="#FFFFFF"/>
    <ellipse cx="392" cy="332" rx="31" ry="16" fill="#FFB3B0" opacity="0.85"/>
    <ellipse cx="632" cy="332" rx="31" ry="16" fill="#FFB3B0" opacity="0.85"/>
    <path d="M476 326 Q512 362 548 326" fill="none" stroke="#2B1B1B" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
